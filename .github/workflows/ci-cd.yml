name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      CRYPTO_KEY: ${{ secrets.CRYPTO_KEY }}
      ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npm test --if-present

  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config=auto --error

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - name: npm audit (fails on High/Critical)
        run: npm audit --audit-level=high

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t nodegoat:ci .
      - name: Trivy scan (fails on High/Critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'nodegoat:ci'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  dast-zap:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB
        run: |
          docker run -d --name mongo-test -p 27017:27017 mongo:4.4
          sleep 5
      - name: Build Docker image
        run: docker build -t nodegoat:ci .
      - name: Run application
        run: |
          docker run -d --name nodegoat-test \
            -p 4000:4000 \
            -e MONGO_URI="mongodb://mongo:27017/nodegoat" \
            -e NODE_ENV="development" \
            nodegoat:ci
          sleep 15
          curl -I http://localhost:4000 || true
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:4000'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
      - name: Cleanup
        if: always()
        run: |
          docker stop nodegoat-test mongo-test || true
          docker rm nodegoat-test mongo-test || true